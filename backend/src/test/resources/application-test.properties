# Tests : base H2 en mémoire (mode MySQL), une base neuve par contexte Spring
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

ironfit.jwt-secret=test-secret-test-secret-test-secret-0123456789
ironfit.data-dir=target/test-data
ironfit.rate-limit=1000
ironfit.seed-demo=true
ironfit.show-reset-code=true
ironfit.admin-password=admin123
