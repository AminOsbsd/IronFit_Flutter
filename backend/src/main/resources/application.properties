# =====================================================================
# IronFit – configuration Spring Boot
# Toutes les valeurs ${VAR:défaut} se surchargent par variable d'environnement.
# =====================================================================

spring.application.name=ironfit
# Variables locales facultatives : backend/.env (format CLÉ=valeur, voir .env.example ; jamais versionné)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
# 0.0.0.0 : accessible depuis un téléphone du réseau local
server.address=${HOST:0.0.0.0}

# ---------- MySQL (XAMPP : MariaDB, port 3306, utilisateur root sans mot de passe) ----------
# createDatabaseIfNotExist : la base ironfit_db est créée au premier lancement
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ironfit_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# XAMPP fournit MariaDB 10.4 (voir XamppMariaDbDialect). Pour un vrai serveur MySQL 8+ : DB_DIALECT=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=${DB_DIALECT:com.ironfit.config.XamppMariaDbDialect}
# update : crée ou complète les tables au démarrage (développement local). Voir README pour la production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------- JSON ----------
# Les champs JSON restent en snake_case (contrat de l'application Flutter)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------- IronFit ----------
ironfit.jwt-secret=${IRONFIT_JWT_SECRET:}
ironfit.token-days=${TOKEN_DAYS:7}
ironfit.data-dir=${DATA_DIR:./data}
ironfit.cors-origins=${CORS_ORIGINS:*}
ironfit.show-reset-code=${SHOW_RESET_CODE:true}
ironfit.seed-demo=${SEED_DEMO:true}
ironfit.admin-password=${ADMIN_PASSWORD:admin123}
ironfit.rate-limit=${RATE_LIMIT:10}

# ---------- Journalisation (aucune donnée sensible) ----------
logging.level.root=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
