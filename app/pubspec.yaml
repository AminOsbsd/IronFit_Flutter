name: ironfit
description: Gestion de salle de sport - IronFit
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.9.0 # Flutter 3.35+ (DropdownButtonFormField.initialValue, flutter_lints 6)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Logo officiel IronFit (original + variante sans fond pour le filigrane)
  assets:
    - assets/images/member_fitness_3d.png
    - assets/images/member_strength_3d.png
    - assets/images/ironfit_logo.png
    - assets/images/ironfit_logo_transparent.png
